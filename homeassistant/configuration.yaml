default_config:

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1

automation: !include automations.yaml
script: !include_dir_merge_named scripts
scene: !include scenes.yaml

input_number:
  pool_billige_timer:
    name: "Antal billige timer poolen skal varme"
    min: 1
    max: 8
    step: 1
    initial: 5
    icon: mdi:counter

  pool_vindue_start:
    name: "Starttime for varmevindue"
    min: 0
    max: 23
    step: 1
    initial: 10
    icon: mdi:clock-start

  pool_vindue_slut:
    name: "Sluttime for varmevindue (eksklusiv - 17 = sidste time er 16-17)"
    min: 1
    max: 24
    step: 1
    initial: 17
    icon: mdi:clock-end

  pool_temp_gulv:
    name: "Gulv-temperatur (varm altid hvis under)"
    min: 18
    max: 28
    step: 0.5
    initial: 24
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low

  pool_temp_maal:
    name: "Mål-temperatur (gennemsnit)"
    min: 20
    max: 32
    step: 0.5
    initial: 27
    unit_of_measurement: "°C"
    icon: mdi:thermometer

  pool_temp_loft:
    name: "Loft-temperatur (sluk altid hvis over)"
    min: 24
    max: 36
    step: 0.5
    initial: 32
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high

input_boolean:
  pool_automation_aktiv:
    name: "Pool-automatisering aktiv"
    icon: mdi:toggle-switch

template:
  - binary_sensor:
      - name: "Pool skal varme nu"
        unique_id: pool_skal_varme_nu
        icon: mdi:pool-thermometer
        state: >
          {% set automation_on = is_state('input_boolean.pool_automation_aktiv', 'on') %}
          {% set temp = states('sensor.pool_water_temp') | float(none) %}
          {% set gulv = states('input_number.pool_temp_gulv') | float(24) %}
          {% set loft = states('input_number.pool_temp_loft') | float(32) %}
          {% set window_start = states('input_number.pool_vindue_start') | int(10) %}
          {% set window_end = states('input_number.pool_vindue_slut') | int(17) %}
          {% set cheap_count = states('input_number.pool_billige_timer') | int(5) %}
          {% set prices = state_attr('sensor.energi_data_service', 'raw_today') %}

          {% if not automation_on %}
            false
          {% elif temp is not none and temp >= loft %}
            false
          {% elif temp is not none and temp < gulv %}
            true
          {% elif prices is none %}
            false
          {% else %}
            {% set window_prices = prices
              | selectattr('hour', 'ge', window_start)
              | selectattr('hour', 'lt', window_end)
              | list %}
            {% set sorted_prices = window_prices
              | sort(attribute='price')
              | map(attribute='hour')
              | list %}
            {% set cheapest = sorted_prices[:cheap_count] %}
            {% set current_hour = now().hour %}
            {{ current_hour in cheapest }}
          {% endif %}
        attributes:
          aarsag: >
            {% set automation_on = is_state('input_boolean.pool_automation_aktiv', 'on') %}
            {% set temp = states('sensor.pool_water_temp') | float(none) %}
            {% set gulv = states('input_number.pool_temp_gulv') | float(24) %}
            {% set loft = states('input_number.pool_temp_loft') | float(32) %}
            {% if not automation_on %}
              Automatisering deaktiveret
            {% elif temp is none %}
              Ingen temp-sensor - kører på pris alene
            {% elif temp >= loft %}
              Loft nået ({{ temp }}°C >= {{ loft }}°C) - batteri fuldt
            {% elif temp < gulv %}
              Under gulv ({{ temp }}°C < {{ gulv }}°C) - varm uanset pris
            {% else %}
              Normal drift - varmer i billige timer
            {% endif %}
          billigste_timer: >
            {% set window_start = states('input_number.pool_vindue_start') | int(10) %}
            {% set window_end = states('input_number.pool_vindue_slut') | int(17) %}
            {% set cheap_count = states('input_number.pool_billige_timer') | int(5) %}
            {% set prices = state_attr('sensor.energi_data_service', 'raw_today') %}
            {% if prices is none %}
              []
            {% else %}
              {% set window_prices = prices
                | selectattr('hour', 'ge', window_start)
                | selectattr('hour', 'lt', window_end)
                | list %}
              {% set sorted_hours = window_prices | sort(attribute='price') | map(attribute='hour') | list %}
              {{ sorted_hours[:cheap_count] | sort }}
            {% endif %}
