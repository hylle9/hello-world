- id: pool_varme_taend
  alias: "Pool: Tænd varme i billig time"
  description: "Lukker Shelly-relæet når den aktuelle time er en af de billigste i varmevinduet"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.pool_skal_varme_nu
      to: "on"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.shelly_pool_aux
    - service: notify.mobile_app_din_iphone
      data:
        title: "Pool-varme TÆNDT"
        message: >
          Strømmen er billig nu ({{ state_attr('sensor.energi_data_service', 'current_price') | round(2) }} kr/kWh).
          Varmer indtil næste pristjek.

- id: pool_varme_sluk
  alias: "Pool: Sluk varme udenfor billig time"
  description: "Bryder Shelly-relæet når den aktuelle time ikke længere er blandt de billigste"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.pool_skal_varme_nu
      to: "off"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.shelly_pool_aux
    - service: notify.mobile_app_din_iphone
      data:
        title: "Pool-varme SLUKKET"
        message: "Den billige periode er slut for nu."

- id: pool_morgenrapport
  alias: "Pool: Morgenrapport om dagens plan"
  description: "Sender notifikation kl. 07:00 med dagens plan for pool-opvarmning"
  mode: single
  trigger:
    - platform: time
      at: "07:00:00"
  action:
    - service: notify.mobile_app_din_iphone
      data:
        title: "Pool-plan for i dag"
        message: >
          Varmer i de billigste {{ states('input_number.pool_billige_timer') }} timer mellem
          kl. {{ states('input_number.pool_vindue_start') }}-{{ states('input_number.pool_vindue_slut') }}.
          Billigste timer i dag: {{ state_attr('binary_sensor.pool_skal_varme_nu', 'billigste_timer') }}.
          Aktuel pool-temp: {{ states('sensor.pool_water_temp') }}°C.

- id: pool_advarsel_gulv_naaet
  alias: "Pool: Advarsel hvis gulv-temperatur er nået i dyr time"
  description: "Hvis vandet falder under gulv-temp tvinges varmen på, men det er dyrt - giv besked"
  mode: single
  trigger:
    - platform: numeric_state
      entity_id: sensor.pool_water_temp
      below: input_number.pool_temp_gulv
  action:
    - service: notify.mobile_app_din_iphone
      data:
        title: "Pool: gulv-temp nået - tvunget opvarmning"
        message: >
          Vandet er nu {{ states('sensor.pool_water_temp') }}°C - under dit gulv
          på {{ states('input_number.pool_temp_gulv') }}°C. Varmer uanset spotpris
          ({{ state_attr('sensor.energi_data_service', 'current_price') | round(2) }} kr/kWh).
